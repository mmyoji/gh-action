name: Test

on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Test
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check Node.js version
        run: node -v

      - name: Test JSON manipulation
        run: |
          node ./scripts/insert-env.ts --name app   > ./test.app.json
          node ./scripts/insert-env.ts --name batch > ./test.batch.json

      - name: Check app JSON
        run: cat test.app.json

      - name: Check batch JSON
        run: cat test.batch.json

name: Test

on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Test
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Test JSON manipulation
        run: |
          cp ./.test/test.json ./test.json
          node -v

      - name: Check JSON
        run: |
          cat test.json
